<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyJin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 480px;
      background: #0a0a0a;
      color: #E1E0CC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(225,224,204,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .header .dot.offline { background: #ef4444; }
    .section {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(225,224,204,0.05);
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(225,224,204,0.4);
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      padding: 8px 12px;
      background: rgba(225,224,204,0.05);
      border: 1px solid rgba(225,224,204,0.1);
      border-radius: 8px;
      color: #E1E0CC;
      font-size: 13px;
      outline: none;
      margin-bottom: 8px;
    }
    input:focus, select:focus {
      border-color: rgba(225,224,204,0.3);
    }
    select option { background: #1a1a1a; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: #E1E0CC;
      color: #0a0a0a;
    }
    .btn-secondary {
      background: rgba(225,224,204,0.08);
      color: #E1E0CC;
      margin-top: 8px;
    }
    .result {
      margin-top: 12px;
      padding: 12px;
      background: rgba(225,224,204,0.03);
      border-radius: 8px;
      font-size: 12px;
    }
    .result .score {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .result .label { color: rgba(225,224,204,0.5); }
    .fields-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .field-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(225,224,204,0.05);
      font-size: 12px;
    }
    .field-item .detected { color: #22c55e; }
    .field-item .missing { color: #ef4444; }
    .field-item button {
      width: auto;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(225,224,204,0.1);
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(225,224,204,0.4);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #E1E0CC;
      border-bottom-color: #E1E0CC;
    }
    .hidden { display: none; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(225,224,204,0.2);
      border-top-color: #E1E0CC;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      text-align: center;
      padding: 24px;
      color: rgba(225,224,204,0.3);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ApplyJin</h1>
    <div class="dot" id="status-dot" title="Checking connection..."></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="autofill">Autofill</div>
    <div class="tab" data-tab="extract">Extract JD</div>
    <div class="tab" data-tab="settings">Settings</div>
  </div>

  <!-- AUTOFILL TAB -->
  <div id="tab-autofill" class="section">
    <div class="section-title">Page detected</div>
    <div id="page-info" class="empty">Scanning page...</div>

    <div id="autofill-form" class="hidden">
      <div class="section-title">Detected fields</div>
      <div id="fields-list" class="fields-list"></div>
      <button class="btn-primary" id="btn-fill" style="margin-top: 12px">
        Fill all fields
      </button>
      <button class="btn-secondary" id="btn-fill-selected">
        Fill selected only
      </button>
    </div>
  </div>

  <!-- EXTRACT JD TAB -->
  <div id="tab-extract" class="section hidden">
    <div class="section-title">Extract job description</div>
    <p style="font-size: 12px; color: rgba(225,224,204,0.5); margin-bottom: 12px">
      Automatically detect and extract the job description from this page.
    </p>
    <button class="btn-primary" id="btn-extract">
      Extract JD from page
    </button>
    <div id="extract-result" class="hidden">
      <div class="result">
        <div class="label">Extracted title</div>
        <div id="extracted-title" style="font-weight: 500; margin-bottom: 8px"></div>
        <div class="label">Extracted company</div>
        <div id="extracted-company" style="font-weight: 500; margin-bottom: 8px"></div>
        <div class="label">Job description length</div>
        <div id="extracted-length" style="font-weight: 500; margin-bottom: 12px"></div>
        <button class="btn-secondary" id="btn-score-jd">Score this JD</button>
        <div id="jd-score" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="section hidden">
    <div class="section-title">Backend URL</div>
    <input type="text" id="input-url" placeholder="https://your-app.onrender.com" />
    <div class="section-title">Auth token (optional)</div>
    <input type="password" id="input-token" placeholder="JWT token from dashboard" />
    <button class="btn-primary" id="btn-save-settings">Save settings</button>
    <div id="settings-saved" class="hidden" style="margin-top: 8px; color: #22c55e; font-size: 12px">
      Settings saved
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
